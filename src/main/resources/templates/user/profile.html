<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/top :: top}"></div>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" id="main">
    <div class="col-md-6 col-md-offset-3">
        <div class="panel panel-default">
            <div class="panel-heading"><h4>Profiles</h4></div>
            <div class="panel-body">
                <div class="well well-sm">
                    <div class="media">
                        <a class="thumbnail pull-left" href="#">
                            <img class="media-object" src="/images/80-text.png">
                        </a>
                        <div class="media-body">
                            <h4 class="media-heading" th:text="${user.name}">사용자 이름</h4>
                            <p>
                                <a href="#" class="btn btn-xs btn-default">
                                    <span class="glyphicon glyphicon-envelope"></span>&nbsp;
                                    <span th:text="${user.email}">이메일</span>
                                </a>
                            </p>
                            <div th:if="${session.loginUser != null and session.loginUser.userId == user.userId}" style="margin-top: 10px;">
                                <a th:href="@{/users/{id}/form(id=${user.userId})}" class="alert alert-danger" style="display: inline-block; margin-top: 5px;">
                                    개인정보수정
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
