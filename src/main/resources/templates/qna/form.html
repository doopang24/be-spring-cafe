<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/top :: top}"></div>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" id="main">
   <div class="col-md-12 col-sm-12 col-lg-10 col-lg-offset-1">
      <div class="panel panel-default content-main">
          <form name="question"
                    th:action="${article != null} ? @{'/questions/' + ${article.id}} : @{'/questions'}" method="post">
                  <input type="hidden" name="_method" th:if="${article != null}" value="PUT" />
              <div class="form-group">
                  <label for="title">제목</label>
                  <input type="text" class="form-control" id="title" name="title" placeholder="제목" th:value="${article?.title}"/>
              </div>
              <div class="form-group">
                  <label for="content">내용</label>
                  <textarea name="contents" id="content" rows="5" class="form-control" th:text="${article?.contents}"></textarea>
              </div>
              <button type="submit" class="btn btn-success clearfix pull-right">질문하기</button>
              <div class="clearfix" />
          </form>
        </div>
    </div>
</div>

<div th:replace="fragments/scripts :: scripts"></div>

	</body>
</html>
